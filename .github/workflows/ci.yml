name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: incidentiq
          POSTGRES_USER: incidentiq
          POSTGRES_PASSWORD: incidentiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentiq -d incidentiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://incidentiq:incidentiq@localhost:5432/incidentiq
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm incidentiq init
      - run: pnpm test
