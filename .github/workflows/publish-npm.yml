name: Publish npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: packages
        run: |
          previous_tag="$(git tag --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)"
          if [ -z "$previous_tag" ] || ! git diff --quiet "$previous_tag" HEAD -- packages/event-schema packages/node-sdk; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.packages.outputs.publish == 'false'
        run: echo "No public npm package changes since the previous release."
      - if: steps.packages.outputs.publish == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - if: steps.packages.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.packages.outputs.publish == 'true'
        run: npm install --global npm@^11.15.0
      - if: steps.packages.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.packages.outputs.publish == 'true'
        run: pnpm test
      - if: steps.packages.outputs.publish == 'true'
        run: pnpm verify:npm-packages
      - if: steps.packages.outputs.publish == 'true'
        run: mkdir .npm-packages
      - if: steps.packages.outputs.publish == 'true'
        run: pnpm --dir packages/event-schema pack --pack-destination ../../.npm-packages
      - if: steps.packages.outputs.publish == 'true'
        run: pnpm --dir packages/node-sdk pack --pack-destination ../../.npm-packages
      - if: steps.packages.outputs.publish == 'true'
        run: |
          package="$(node -p 'const manifest = require("./packages/event-schema/package.json"); `${manifest.name}@${manifest.version}`')"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already published."
          else
            npm stage publish .npm-packages/incidentiqhq-event-schema-*.tgz --access public
          fi
      - if: steps.packages.outputs.publish == 'true'
        run: |
          package="$(node -p 'const manifest = require("./packages/node-sdk/package.json"); `${manifest.name}@${manifest.version}`')"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already published."
          else
            npm stage publish .npm-packages/incidentiqhq-node-sdk-*.tgz --access public
          fi
