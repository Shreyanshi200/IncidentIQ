apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-rollout-failure
  labels:
    app.kubernetes.io/name: orders
spec:
  progressDeadlineSeconds: 10
  selector:
    matchLabels:
      app: orders-rollout-failure
  template:
    metadata:
      labels:
        app: orders-rollout-failure
        app.kubernetes.io/name: orders
    spec:
      containers:
        - name: api
          image: registry.invalid/incidentiq/orders:does-not-exist
---
apiVersion: batch/v1
kind: Job
metadata:
  name: settlement-failure
  labels:
    app.kubernetes.io/name: orders
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["/bin/sh", "-c", "exit 1"]
