apiVersion: v1
kind: ServiceAccount
metadata:
  name: incidentiq-kubernetes-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incidentiq-kubernetes-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incidentiq-kubernetes-collector
subjects:
  - kind: ServiceAccount
    name: incidentiq-kubernetes-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incidentiq-kubernetes-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentiq-kubernetes-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incidentiq-kubernetes-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incidentiq-kubernetes-collector
    spec:
      serviceAccountName: incidentiq-kubernetes-collector
      containers:
        - name: collector
          image: your-registry/incidentiq-kubernetes-collector:0.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: INCIDENTIQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: incidentiq
                  key: api-key
            - name: INCIDENTIQ_API_URL
              value: https://incidentiq.example.com
            - name: INCIDENTIQ_TENANT_ID
              value: local
            - name: INCIDENTIQ_ENVIRONMENT
              value: production
            - name: INCIDENTIQ_CLUSTER_NAME
              value: production-cluster
            - name: INCIDENTIQ_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
