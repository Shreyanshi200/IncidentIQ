services:
  api:
    image: ${INCIDENTIQ_API_IMAGE:?Set an immutable ghcr.io image tag in .env}
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
